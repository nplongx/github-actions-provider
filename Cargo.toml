[package]
name = "github-actions-provider"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Fail-closed GitHub Actions workflow-dispatch adapter with provider intent contracts"
repository = "https://github.com/nplongx/github-actions-provider"
readme = "README.md"
keywords = ["github-actions", "workflow", "provider", "idempotency"]
categories = ["development-tools"]

[dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
